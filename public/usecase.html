<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-ERGO - Use Case Diagram System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f8fafc;
            --border-color: #000000;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navigation Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            margin-bottom: 20px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .title-group h1 {
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-group p {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #000000;
            border-radius: 8px;
            background: #ffffff;
            color: #000000;
            transition: all 0.15s ease;
            text-decoration: none;
            box-shadow: 2px 2px 0px #000000;
        }

        .btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000000;
        }

        .btn-black {
            background: #000000;
            color: #ffffff;
        }

        .btn-black:hover {
            background: #1e293b;
        }

        /* Canvas Wrapper */
        .usecase-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .usecase-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f1f5f9;
            border-bottom: 2px solid var(--border-color);
        }

        .toolbar-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #000000;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zoom-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 65px;
            text-align: center;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 14px;
        }

        .diagram-viewport {
            flex: 1;
            min-height: 75vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background-color: #ffffff;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            user-select: none;
        }

        .diagram-viewport:active {
            cursor: grabbing;
        }

        .diagram-content {
            transform-origin: 0 0;
            position: absolute;
            top: 0;
            left: 0;
            padding: 40px;
            display: inline-block;
        }

        /* SVG Styling */
        svg {
            background: #ffffff;
            display: block;
        }

        /* UML Elements Styling */
        .system-boundary {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 3px;
            rx: 16px;
            ry: 16px;
        }

        .system-title {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 800;
            fill: #000000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .package-boundary {
            fill: #f8fafc;
            stroke: #94a3b8;
            stroke-width: 1.5px;
            stroke-dasharray: 4 4;
            rx: 8px;
            ry: 8px;
        }

        .package-title {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            fill: #334155;
            text-transform: uppercase;
        }

        .actor-symbol {
            stroke: #000000;
            stroke-width: 2.5px;
            fill: #ffffff;
        }

        .actor-head {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5px;
        }

        .actor-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            fill: #000000;
            text-anchor: middle;
        }

        .actor-role-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            fill: #475569;
            text-anchor: middle;
        }

        .usecase-oval {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2px;
            filter: drop-shadow(2px 2px 0px #000000);
            transition: all 0.2s;
        }

        .usecase-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .usecase-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            fill: #475569;
            text-anchor: middle;
        }

        .assoc-line {
            stroke: #000000;
            stroke-width: 2px;
        }

        .include-line {
            stroke: #2563eb;
            stroke-width: 2px;
            stroke-dasharray: 6 4;
            marker-end: url(#arrow-blue);
        }

        .extend-line {
            stroke: #d97706;
            stroke-width: 2px;
            stroke-dasharray: 6 4;
            marker-end: url(#arrow-orange);
        }

        .rel-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            fill: #0f172a;
            text-anchor: middle;
            background: #ffffff;
        }

        .hint-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media print {
            .header-bar, .usecase-toolbar, .hint-overlay { display: none !important; }
            body { padding: 0; background: white; }
            .usecase-container { border: none; box-shadow: none; }
            .diagram-viewport { overflow: visible; min-height: auto; background: none; }
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div class="title-group">
            <h1><i class="fa-solid fa-diagram-project"></i> AI-ERGO &bull; Use Case Diagram</h1>
            <p>UML Use Case Diagram System (5 Aktor &amp; 33 Use Cases Berdasarkan PRD / Modul System)</p>
        </div>
        <div class="actions">
            <button class="btn btn-black" id="btnDownloadPNG" onclick="downloadPNG()">
                <i class="fa-solid fa-file-image"></i> Unduh File PNG (HD)
            </button>
            <button class="btn" onclick="toggleFullscreen()">
                <i class="fa-solid fa-expand" id="fullscreenIcon"></i> Fullscreen
            </button>
            <button class="btn" onclick="window.print()">
                <i class="fa-solid fa-print"></i> Cetak / PDF
            </button>
        </div>
    </div>

    <!-- Main Diagram Box -->
    <div class="usecase-container" id="usecaseContainer">
        <div class="usecase-toolbar">
            <div class="toolbar-title">
                <i class="fa-solid fa-network-wired"></i> Visualisasi Use Case UML
            </div>
            <div class="controls-group">
                <button class="btn btn-icon" onclick="zoomIn()" title="Perbesar (Zoom In)">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="btn btn-icon" onclick="zoomOut()" title="Perkecil (Zoom Out)">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span class="zoom-badge" id="zoomVal">100%</span>
                <button class="btn btn-icon" onclick="resetZoom()" title="Reset Ukuran (100%)">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="btn btn-icon" onclick="fitZoom()" title="Paskan ke Layar">
                    <i class="fa-solid fa-compress"></i>
                </button>
            </div>
        </div>

        <div class="diagram-viewport" id="diagramViewport">
            <div class="diagram-content" id="diagramContent">
                
                <!-- SVG UML USE CASE DIAGRAM -->
                <svg id="usecaseSVG" width="2200" height="1500" viewBox="0 0 2200 1500" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Arrow Markers -->
                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
                        </marker>
                        <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" />
                        </marker>
                    </defs>

                    <!-- SYSTEM BOUNDARY BOX -->
                    <rect x="360" y="40" width="1480" height="1420" class="system-boundary" />
                    <text x="1100" y="85" class="system-title" text-anchor="middle">SISTEM AI-ERGO (ERGONOMIC RISK ASSESSMENT ENGINE)</text>

                    <!-- ==================== LEFT ACTORS ==================== -->
                    <!-- Super Admin Actor -->
                    <g id="actor-superadmin" transform="translate(140, 220)">
                        <circle cx="0" cy="-30" r="22" class="actor-head" />
                        <line x1="0" y1="-8" x2="0" y2="40" class="actor-symbol" />
                        <line x1="-30" y1="10" x2="30" y2="10" class="actor-symbol" />
                        <line x1="0" y1="40" x2="-22" y2="85" class="actor-symbol" />
                        <line x1="0" y1="40" x2="22" y2="85" class="actor-symbol" />
                        <text x="0" y="115" class="actor-label">Super Admin</text>
                        <text x="0" y="133" class="actor-role-badge">[System Administrator]</text>
                    </g>

                    <!-- Admin K3 Actor -->
                    <g id="actor-admink3" transform="translate(140, 680)">
                        <circle cx="0" cy="-30" r="22" class="actor-head" />
                        <line x1="0" y1="-8" x2="0" y2="40" class="actor-symbol" />
                        <line x1="-30" y1="10" x2="30" y2="10" class="actor-symbol" />
                        <line x1="0" y1="40" x2="-22" y2="85" class="actor-symbol" />
                        <line x1="0" y1="40" x2="22" y2="85" class="actor-symbol" />
                        <text x="0" y="115" class="actor-label">Admin K3</text>
                        <text x="0" y="133" class="actor-role-badge">[HSE & K3 Manager]</text>
                    </g>

                    <!-- HRD Actor -->
                    <g id="actor-hrd" transform="translate(140, 1140)">
                        <circle cx="0" cy="-30" r="22" class="actor-head" />
                        <line x1="0" y1="-8" x2="0" y2="40" class="actor-symbol" />
                        <line x1="-30" y1="10" x2="30" y2="10" class="actor-symbol" />
                        <line x1="0" y1="40" x2="-22" y2="85" class="actor-symbol" />
                        <line x1="0" y1="40" x2="22" y2="85" class="actor-symbol" />
                        <text x="0" y="115" class="actor-label">HRD Manager</text>
                        <text x="0" y="133" class="actor-role-badge">[Human Resource Dept]</text>
                    </g>


                    <!-- ==================== RIGHT ACTORS ==================== -->
                    <!-- Ergonomist Actor -->
                    <g id="actor-ergonomist" transform="translate(2040, 480)">
                        <circle cx="0" cy="-30" r="22" class="actor-head" />
                        <line x1="0" y1="-8" x2="0" y2="40" class="actor-symbol" />
                        <line x1="-30" y1="10" x2="30" y2="10" class="actor-symbol" />
                        <line x1="0" y1="40" x2="-22" y2="85" class="actor-symbol" />
                        <line x1="0" y1="40" x2="22" y2="85" class="actor-symbol" />
                        <text x="0" y="115" class="actor-label">Ergonomist</text>
                        <text x="0" y="133" class="actor-role-badge">[Pakar / Assessor]</text>
                    </g>

                    <!-- Employee Actor -->
                    <g id="actor-employee" transform="translate(2040, 1020)">
                        <circle cx="0" cy="-30" r="22" class="actor-head" />
                        <line x1="0" y1="-8" x2="0" y2="40" class="actor-symbol" />
                        <line x1="-30" y1="10" x2="30" y2="10" class="actor-symbol" />
                        <line x1="0" y1="40" x2="-22" y2="85" class="actor-symbol" />
                        <line x1="0" y1="40" x2="22" y2="85" class="actor-symbol" />
                        <text x="0" y="115" class="actor-label">Employee</text>
                        <text x="0" y="133" class="actor-role-badge">[Pekerja / User]</text>
                    </g>


                    <!-- ==================== USE CASE PACKAGES & OVALS ==================== -->

                    <!-- 1. AUTHENTICATION MODULE -->
                    <rect x="390" y="110" width="1420" height="110" class="package-boundary" />
                    <text x="410" y="132" class="package-title">1. Modul Otentikasi &amp; Profil</text>

                    <!-- UC-01 Login -->
                    <g id="uc-login" transform="translate(620, 170)">
                        <ellipse cx="0" cy="0" rx="110" ry="32" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SYS-01</text>
                        <text x="0" y="10" class="usecase-text">Login Sistem (Multi-Role)</text>
                    </g>

                    <!-- UC-02 Manage Profile -->
                    <g id="uc-profile" transform="translate(1080, 170)">
                        <ellipse cx="0" cy="0" rx="110" ry="32" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SYS-02</text>
                        <text x="0" y="10" class="usecase-text">Kelola Profil &amp; Password</text>
                    </g>

                    <!-- UC-03 Logout -->
                    <g id="uc-logout" transform="translate(1540, 170)">
                        <ellipse cx="0" cy="0" rx="90" ry="30" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SYS-03</text>
                        <text x="0" y="10" class="usecase-text">Logout Sistem</text>
                    </g>


                    <!-- 2. SYSTEM & ORGANIZATIONAL MANAGEMENT (SUPER ADMIN) -->
                    <rect x="390" y="245" width="1420" height="230" class="package-boundary" />
                    <text x="410" y="267" class="package-title">2. Modul Administrasi Organisasi &amp; Sistem (Super Admin)</text>

                    <!-- UC-SA-01 Manage Companies -->
                    <g id="uc-companies" transform="translate(560, 330)">
                        <ellipse cx="0" cy="0" rx="125" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-01</text>
                        <text x="0" y="10" class="usecase-text">Kelola Perusahaan (Companies)</text>
                    </g>

                    <!-- UC-SA-02 Manage Users -->
                    <g id="uc-users" transform="translate(860, 330)">
                        <ellipse cx="0" cy="0" rx="120" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-02</text>
                        <text x="0" y="10" class="usecase-text">Kelola Pengguna (Users)</text>
                    </g>

                    <!-- UC-SA-03 Roles & Permissions -->
                    <g id="uc-roles" transform="translate(1160, 330)">
                        <ellipse cx="0" cy="0" rx="120" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-03</text>
                        <text x="0" y="10" class="usecase-text">Kelola Role &amp; Permissions</text>
                    </g>

                    <!-- UC-SA-04 AI Engine Config -->
                    <g id="uc-ai-config" transform="translate(1460, 330)">
                        <ellipse cx="0" cy="0" rx="125" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-04</text>
                        <text x="0" y="10" class="usecase-text">Konfigurasi AI &amp; API Key</text>
                    </g>

                    <!-- UC-SA-05 Audit Logs -->
                    <g id="uc-audit" transform="translate(710, 415)">
                        <ellipse cx="0" cy="0" rx="120" ry="32" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-05</text>
                        <text x="0" y="10" class="usecase-text">Audit Log &amp; Monitoring</text>
                    </g>

                    <!-- UC-SA-06 Backup Database -->
                    <g id="uc-backup" transform="translate(1080, 415)">
                        <ellipse cx="0" cy="0" rx="120" ry="32" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-SA-06</text>
                        <text x="0" y="10" class="usecase-text">Backup &amp; Restore Database</text>
                    </g>


                    <!-- 3. MASTER DATA PEKERJA (ADMIN K3 & HRD) -->
                    <rect x="390" y="495" width="1420" height="210" class="package-boundary" />
                    <text x="410" y="517" class="package-title">3. Modul Master Data Pekerja &amp; Struktur (Admin K3 &amp; HRD)</text>

                    <!-- UC-AK3-01 Employee Data -->
                    <g id="uc-emp-data" transform="translate(580, 580)">
                        <ellipse cx="0" cy="0" rx="125" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-AK3-01</text>
                        <text x="0" y="10" class="usecase-text">Kelola Data Pekerja (Employees)</text>
                    </g>

                    <!-- UC-AK3-02 Dept & Position -->
                    <g id="uc-dept-pos" transform="translate(900, 580)">
                        <ellipse cx="0" cy="0" rx="130" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-AK3-02</text>
                        <text x="0" y="10" class="usecase-text">Kelola Departemen &amp; Jabatan</text>
                    </g>

                    <!-- UC-AK3-03 Job Profile -->
                    <g id="uc-job-profile" transform="translate(1230, 580)">
                        <ellipse cx="0" cy="0" rx="125" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-AK3-03</text>
                        <text x="0" y="10" class="usecase-text">Kelola Job Profile &amp; Beban Kerja</text>
                    </g>

                    <!-- UC-AK3-04 Import Excel -->
                    <g id="uc-import-excel" transform="translate(1540, 580)">
                        <ellipse cx="0" cy="0" rx="110" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-AK3-04</text>
                        <text x="0" y="10" class="usecase-text">Import Data Pekerja Excel</text>
                    </g>


                    <!-- 4. NBM ASSESSMENT & ERGONOMIC RISK EVALUATION -->
                    <rect x="390" y="725" width="1420" height="250" class="package-boundary" />
                    <text x="410" y="747" class="package-title">4. Modul Assessment Ergonomi &amp; Nordic Body Map (NBM)</text>

                    <!-- UC-EMP-01 Fill NBM -->
                    <g id="uc-nbm-fill" transform="translate(1560, 800)">
                        <ellipse cx="0" cy="0" rx="135" ry="36" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-EMP-01</text>
                        <text x="0" y="10" class="usecase-text">Isi Kuesioner Nordic Body Map (28 Bagian)</text>
                    </g>

                    <!-- UC-AK3-05 Create Assessment -->
                    <g id="uc-create-assess" transform="translate(1080, 800)">
                        <ellipse cx="0" cy="0" rx="130" ry="36" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-AK3-05</text>
                        <text x="0" y="10" class="usecase-text">Input Assessment Baru Pekerja</text>
                    </g>

                    <!-- UC-SYS-04 Calculate Risk Score -->
                    <g id="uc-calc-risk" transform="translate(600, 800)">
                        <ellipse cx="0" cy="0" rx="135" ry="36" class="usecase-oval" style="stroke:#2563eb;" />
                        <text x="0" y="-8" class="usecase-id" style="fill:#2563eb;">UC-SYS-04</text>
                        <text x="0" y="10" class="usecase-text">Hitung Skor NBM &amp; Level Risiko</text>
                    </g>

                    <!-- UC-EMP-02 View Assessment History -->
                    <g id="uc-assess-history" transform="translate(1320, 895)">
                        <ellipse cx="0" cy="0" rx="130" ry="34" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-EMP-02</text>
                        <text x="0" y="10" class="usecase-text">Lihat Histori Assessment Pribadi</text>
                    </g>


                    <!-- 5. AI RECOMMENDATION ENGINE & EXPERT VALIDATION -->
                    <rect x="390" y="995" width="1420" height="230" class="package-boundary" />
                    <text x="410" y="1017" class="package-title">5. Modul AI Recommendation &amp; Expert Validation (LLM Engine)</text>

                    <!-- UC-AI-01 Generate AI Rec -->
                    <g id="uc-ai-gen" transform="translate(620, 1080)">
                        <ellipse cx="0" cy="0" rx="140" ry="38" class="usecase-oval" style="stroke:#d97706;" />
                        <text x="0" y="-8" class="usecase-id" style="fill:#d97706;">UC-AI-01</text>
                        <text x="0" y="10" class="usecase-text">Generate Rekomendasi AI (LLM Prompt)</text>
                    </g>

                    <!-- UC-ERG-01 Validate AI Rec -->
                    <g id="uc-ai-val" transform="translate(1080, 1080)">
                        <ellipse cx="0" cy="0" rx="135" ry="38" class="usecase-oval" />
                        <text x="0" y="-8" class="usecase-id">UC-ERG-01</text>
                        <text x="0" y="10" class="usecase-text">Validasi Hasil Rekomendasi AI</text>
                    </g>

    <script>
        // Pan & Zoom Implementation
        let scale = 1.0;
        let pointX = 20;
        let pointY = 20;
        let startX = 0;
        let startY = 0;
        let isPanning = false;

        const viewport = document.getElementById('diagramViewport');
        const content = document.getElementById('diagramContent');
        const zoomVal = document.getElementById('zoomVal');

        function setTransform() {
            content.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomVal.innerText = Math.round(scale * 100) + '%';
        }

        function zoomIn() {
            scale = Math.min(scale * 1.25, 3.5);
            setTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.25, 0.35);
            setTransform();
        }

        function resetZoom() {
            scale = 1.0;
            pointX = 20;
            pointY = 20;
            setTransform();
        }

        function fitZoom() {
            const svg = document.getElementById('usecaseSVG');
            if (!svg) return;
            const vRect = viewport.getBoundingClientRect();
            
            const scaleX = (vRect.width - 60) / 2200;
            const scaleY = (vRect.height - 60) / 1500;
            
            scale = Math.max(Math.min(scaleX, scaleY), 0.35);
            pointX = 20;
            pointY = 20;
            setTransform();
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            isPanning = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - viewport.getBoundingClientRect().left - pointX) / scale;
            const ys = (e.clientY - viewport.getBoundingClientRect().top - pointY) / scale;
            const delta = -e.deltaY;
            
            if (delta > 0) {
                scale = Math.min(scale * 1.12, 3.5);
            } else {
                scale = Math.max(scale / 1.12, 0.35);
            }
            
            pointX = (e.clientX - viewport.getBoundingClientRect().left) - xs * scale;
            pointY = (e.clientY - viewport.getBoundingClientRect().top) - ys * scale;
            setTransform();
        }, { passive: false });

        window.addEventListener('load', () => {
            fitZoom();
        });

        // High Resolution PNG Download
        function downloadPNG() {
            const svgElement = document.getElementById('usecaseSVG');
            if (!svgElement) return;

            const svgClone = svgElement.cloneNode(true);
            const width = 2200;
            const height = 1500;

            svgClone.setAttribute('width', width);
            svgClone.setAttribute('height', height);
            svgClone.setAttribute('style', 'background-color: #ffffff;');

            const svgData = new XMLSerializer().serializeToString(svgClone);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 2x HD resolution
            const scaleFactor = 2;
            canvas.width = width * scaleFactor;
            canvas.height = height * scaleFactor;

            const img = new Image();
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scaleFactor, scaleFactor);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);

                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = 'use_case_diagram_ai_ergo.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };

            img.src = url;
        }

        function toggleFullscreen() {
            const container = document.getElementById('usecaseContainer');
            const icon = document.getElementById('fullscreenIcon');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                icon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                icon.className = 'fa-solid fa-expand';
            }
        }
    </script>
